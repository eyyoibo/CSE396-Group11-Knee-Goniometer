name: Group 11 CI & Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.10 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test Araclarini Yukle
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 numpy

      - name: Syntax Kontrolu (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Modul Birim Testlerini Calistir (Pytest)
        run: |
          pytest tests/
