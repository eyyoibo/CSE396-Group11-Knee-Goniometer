; =============================================================
; Diz Gonyometresi - Enkoder Firmware
; Platform: ESP32-DevKitC
; Framework: ESP-IDF
; =============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; Derleme bayrakları
build_flags =
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BT_CLASSIC_ENABLED=1
    -DCONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=1

; Seri port ayarları (gerektiğinde düzenleyin)
; upload_port = COM3
; monitor_port = COM3
